spring.application.name=crystal-report-service
spring.main.web-application-type=none
spring.main.banner-mode=off

# Se dejara en true cuando se incorpore el servidor web y la monitorizacion.
spring.lifecycle.timeout-per-shutdown-phase=20s

# El runtime JRC se carga desde lib_local; estas opciones evitan configuracion grafica.
java.awt.headless=true

# Logging propio del proceso (no se usa spring-boot-starter-logging).
crystal.logging.directory=logs
crystal.logging.file=crystal-exporter.log
crystal.logging.level=INFO

# Conexion que Crystal usara para los reportes que acceden a una base de datos.
# Se mantiene desactivada hasta configurar los valores del entorno.
crystal.database.enabled=false
crystal.database.server=
crystal.database.name=
crystal.database.username=
crystal.database.password=