// Commit-Version: 0.1.0-20261006214500
// Commit-Date: 2026-10-06T21:45:00Z
// Autor: Antonio Duce
// Version del programa: 0.1.0; la version de release y su fecha se guardan en release.properties.
// Este fichero define el build reproducible y conserva las dependencias JRC locales.

plugins {
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'application'
}

group = 'local.crystal'
def baseVersion = '0.1.0'
def gitRevision = 'unknown'
try {
    def process = ['git', 'rev-parse', '--short=8', 'HEAD'].execute()
    process.waitFor()
    if (process.exitValue() == 0) {
        gitRevision = process.in.text.trim()
    }
} catch (Exception ignored) {
    // El build sigue siendo posible en una copia sin la herramienta Git.
}
def releasePropertiesFile = file('release.properties')
def releaseProperties = new Properties()
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseVersion = releaseProperties.getProperty('version')
version = releaseVersion ?: "${baseVersion}-${gitRevision}"

def metadataFiles = [
        'README.md', '.gitignore', 'build.gradle', 'settings.gradle',
        'config-example/application.properties', 'run-report.bat', 'run-report.sh',
        'run-crystal-report.bat', 'release.bat', 'release.sh', '.githooks/pre-commit',
        'src/main/java/local/crystal/CrystalDatabaseProperties.java',
        'src/main/java/local/crystal/CrystalReportApplication.java',
        'src/main/java/local/crystal/ExportCrystalReport.java',
        'src/test/java/local/crystal/ExportCrystalReportTest.java',
        'src/test/java/local/crystal/CrystalReportsIntegrationTest.java'
]

tasks.register('updateMetadata') {
    group = 'versioning'
    description = 'Actualiza fecha y version de release en los ficheros propios.'
    def commitDate = project.findProperty('commitDate') ?: java.time.Instant.now().toString()
    def commitVersion = project.findProperty('commitVersion') ?: "${baseVersion}-${commitDate.replaceAll('[^0-9]', '').take(14)}"
    doLast {
        releasePropertiesFile.text = "# Autor: Antonio Duce\n# Metadatos generados por Gradle; no editar manualmente.\nversion=${commitVersion}\ncommitDate=${commitDate}\n"
        metadataFiles.collect { file(it) }.findAll { it.isFile() }.each { metadataFile ->
            def commentPrefix = metadataFile.name.endsWith('.java') || metadataFile.name.endsWith('.gradle') ? '//' :
                    (metadataFile.name.endsWith('.bat') ? 'rem' :
                            (metadataFile.name.endsWith('.md') ? '>' : '#'))
                def dateLine = "${commentPrefix} Commit-Date: ${commitDate}"
                def versionLine = "${commentPrefix} Commit-Version: ${commitVersion}"
            def lines = metadataFile.readLines('UTF-8')
            def hasDate = false
            def hasVersion = false
            lines = lines.collect { line ->
                if (line.trim().startsWith("${commentPrefix} Commit-Date:")) {
                    hasDate = true
                    return dateLine
                }
                if (line.trim().startsWith("${commentPrefix} Commit-Version:")) {
                    hasVersion = true
                    return versionLine
                }
                return line
            }
            def insertAt = lines && lines[0].startsWith('#!') ? 1 : 0
            if (!hasVersion) {
                lines.add(insertAt++, versionLine)
            }
            if (!hasDate) {
                lines.add(insertAt, dateLine)
            }
            metadataFile.setText(lines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
        println "Metadata actualizado: ${commitVersion} (${commitDate})"
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': 'Crystal Report PDF Service',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'Antonio Duce')
    }
}

tasks.register('gitVersion') {
    group = 'versioning'
    description = 'Muestra la version base y la revision Git usada por el build.'
    doLast {
        println "${project.name} version ${project.version}"
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

repositories {
    mavenCentral()
}

def crystalLibDir = file('lib_local')

dependencies {
    implementation fileTree(dir: crystalLibDir, include: '*.jar')

    implementation('org.springframework.boot:spring-boot-starter') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    group = 'verification'
    description = 'Abre y exporta todos los RPT de Crystal-Reports-master.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter test
}

application {
    mainClass = 'local.crystal.CrystalReportApplication'
}

tasks.register('runReport', JavaExec) {
    group = 'application'
    description = 'Abre un RPT y lo exporta a PDF usando el runtime JRC local.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    def reportArgument = project.findProperty('rpt') ?: '../assets/CR4EMIP32_0-80004572/eclipse/plugins/com.businessobjects.crystalreports.samples_12.2.233.r5802/SampleReports/Statement of Account.rpt'
    def pdfArgument = project.findProperty('pdf') ?: 'build/output/reporte.pdf'
    def parametersArgument = project.findProperty('parameters') ?: ''
    def printerArgument = project.findProperty('printer') ?: ''
    def configDirectory = project.findProperty('configDir') ?: System.getenv('CRYSTAL_CONFIG_DIR')
    if (configDirectory) {
        systemProperty 'spring.config.location', "file:${configDirectory.replace('\\', '/')}/"
    }
    args reportArgument, pdfArgument, parametersArgument, printerArgument
}

tasks.named('bootRun') {
    systemProperty 'java.awt.headless', 'true'
}
