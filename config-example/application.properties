# Autor: Antonio Duce
# Version del programa: 0.1.0; la revision Git se incorpora al artefacto.
# Copiar este fichero a una ruta protegida del servidor, fuera del JAR.
# Windows recomendado: C:/ProgramData/CrystalReportService/config/application.properties
# Red Hat recomendado: /etc/crystal-report-service/application.properties

spring.application.name=crystal-report-service
spring.main.web-application-type=none
spring.main.banner-mode=off
java.awt.headless=true

crystal.logging.directory=${CRYSTAL_LOG_DIR:logs}
crystal.logging.file=crystal-exporter.log
crystal.logging.level=${CRYSTAL_LOG_LEVEL:INFO}

crystal.database.enabled=false
crystal.database.server=
crystal.database.name=
crystal.database.username=
crystal.database.password=${CRYSTAL_DATABASE_PASSWORD:}

# Politica global; la impresora concreta se pasa por cada trabajo, no aqui.
crystal.print.enabled=false
crystal.print.keep-pdf=true